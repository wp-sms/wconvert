<title>Template gallery prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&family=Bebas+Neue&family=Cormorant+Garamond:ital@0;1&family=Archivo+Black&display=swap">
<!--
  PROTOTYPE — throwaway. One template gallery + DesignStage, plan step 0 (review gate).
  Every design here is drawn by the shipping renderer (tools/design-library/out/renderer.iife.js)
  from the real setups in tools/design-library/out/all-campaigns.json. Built by build.mjs.
  The WordPress admin is light-only, so this page commits to the admin's one light look.
-->
<style>
/* Layout: WordPress admin frame (sidebar + admin bar) around WConvert's Harbor tokens; the frame width is the prototype's 1440/360 switch. */
:root {
  --bg: #f6f5f1; --fg: #302720; --card: #ffffff; --surface: #efede8; --muted: #6b6056;
  --border: #dedad1; --input: #857a6e; --action: #1f5a6b; --action-fg: #ffffff; --ice: #e0eff3; --ice-fg: #163f4b;
  --warning: #8a5a00; --warning-surface: #fdecc8; --destructive: #b42318; --destructive-surface: #fbe6e3;
  --success: #17703f; --success-surface: #e6f2e9; --stage: #f1f1ef; --overlay: rgb(48 39 32 / .55);
  --primary: #302720; --primary-fg: #faf6ed; --brand: #e2f475; --rec: #f1f8c8; --rec-fg: #485000;
  --wp-bar: #1d2327; --wp-text: #f0f0f1; --wp-muted: #a7aaad; --wp-active: #2271b1;
  --ghost-page: #ffffff; --ghost-ink: #e9e7e2; --ghost-soft: #f2f1ed; --ghost-dim: rgb(48 39 32 / .32);
  --proto: #15120f; --proto-fg: #f4f1ea; --proto-soft: #3a332d; --proto-accent: #e2f475;
  --font: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: .375rem; --ctl: 2.25rem; --ctl-sm: 2rem;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: #dcd9d2; color: var(--fg); font: .875rem/1.3125rem var(--font); -webkit-font-smoothing: antialiased; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 120px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
.sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { inline-size: 1rem; block-size: 1rem; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.s { inline-size: .75rem; block-size: .75rem; }

/* ---------- the frame: 1440 or 360, with the WordPress chrome ---------- */
.frame { margin-inline: auto; inline-size: min(1440px, 100%); background: var(--bg); container: app / inline-size; box-shadow: 0 1px 0 rgb(0 0 0 / .06), 0 12px 40px -18px rgb(0 0 0 / .35); min-block-size: 760px; overflow: hidden; }
.frame.w360 { inline-size: min(360px, 100%); }
.wpbar { block-size: 32px; background: var(--wp-bar); color: var(--wp-text); display: flex; align-items: center; gap: 14px; padding-inline: 10px; font-size: 13px; }
.wpbar b { font-weight: 600; }
.wpbar span { color: var(--wp-muted); }
.wpwrap { display: flex; min-block-size: 728px; }
.wpside { inline-size: 160px; flex: none; background: var(--wp-bar); color: var(--wp-text); padding-block: 8px; font-size: 14px; }
.wpside div { padding: 7px 12px; color: var(--wp-text); }
.wpside div.on { background: var(--wp-active); }
.wpside div.sub { padding-block: 5px; padding-inline-start: 22px; font-size: 13px; background: #2c3338; color: #c3c4c7; }
.wpside div.sub.on { color: #fff; font-weight: 600; background: #2c3338; }
.wpmain { flex: 1; min-inline-size: 0; }
@container app (max-width: 782px) {
  .wpside { display: none; }
  .wpbar { block-size: 46px; }
}
.wch { background: var(--card); border-block-end: 1px solid var(--border); display: flex; align-items: center; gap: 22px; padding-inline: 24px; block-size: 56px; }
.wch .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.0625rem; letter-spacing: -.01em; }
.wch .brand i { inline-size: 18px; block-size: 18px; border-radius: 4px; background: var(--brand); box-shadow: inset 0 0 0 1px rgb(48 39 32 / .25); }
.wch nav { display: flex; gap: 18px; color: var(--muted); }
.wch nav b { color: var(--fg); font-weight: 600; box-shadow: inset 0 -2px 0 var(--fg); padding-block: 17px; }
@container app (max-width: 782px) {
  .wch { padding-inline: 16px; }
  .wch nav { display: none; }
  .wch .menu { margin-inline-start: auto; }
}
@container app (min-width: 783px) { .wch .menu { display: none; } }
.content { padding: 24px; }
@container app (max-width: 782px) { .content { padding: 12px; } }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; block-size: var(--ctl); padding-inline: 14px; border-radius: var(--r); border: 1px solid var(--input); background: var(--card); color: var(--fg); font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--surface); }
.btn.sm { block-size: var(--ctl-sm); padding-inline: 12px; font-size: .8125rem; }
.btn.pri { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn.pri:hover { background: #4a3f36; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface); }
.btn.icon { inline-size: var(--ctl-sm); block-size: var(--ctl-sm); padding: 0; }
.btn[disabled] { opacity: .6; cursor: default; }
.btn.link { color: var(--action); border-color: var(--border); }
@media (pointer: coarse) { .btn, .btn.sm { min-block-size: 44px; } .btn.icon { min-inline-size: 44px; } .seg button { min-block-size: 44px; } }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r); background: var(--card); padding: 2px; gap: 2px; flex-wrap: nowrap; }
.seg button { border: 0; background: transparent; block-size: calc(var(--ctl-sm) - 6px); padding-inline: 10px; border-radius: calc(var(--r) - 2px); color: var(--muted); font-weight: 500; font-size: .8125rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-fg); }
.seg button:not([aria-pressed="true"]):hover { background: var(--surface); color: var(--fg); }
.tier { display: inline-flex; align-items: center; gap: 3px; font-size: .6875rem; line-height: 1rem; font-weight: 600; letter-spacing: .01em; color: var(--muted); background: var(--surface); border-radius: 999px; padding-inline: 6px; }
.seg button[aria-pressed="true"] .tier { background: rgb(255 255 255 / .16); color: var(--primary-fg); }
.field { display: inline-flex; align-items: center; gap: 8px; }
.field > span { font-size: .8125rem; color: var(--muted); white-space: nowrap; }
.select { block-size: var(--ctl-sm); border: 1px solid var(--input); border-radius: var(--r); background: var(--card); padding-inline: 10px 28px; font-size: .8125rem; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
[dir="rtl"] .select { padding-inline: 10px 28px; background-position: 14px 50%, 9px 50%; }
.search { position: relative; flex: 1 1 16rem; min-inline-size: 0; }
.search svg { position: absolute; inset-inline-start: 10px; inset-block-start: 50%; translate: 0 -50%; color: var(--muted); }
.search input { inline-size: 100%; block-size: var(--ctl-sm); border: 1px solid var(--input); border-radius: var(--r); padding-inline: 32px 10px; background: var(--card); font-size: .8125rem; }
.chip { display: inline-flex; align-items: center; gap: 4px; block-size: 22px; padding-inline: 8px; border-radius: 999px; font-size: .75rem; font-weight: 500; white-space: nowrap; border: 1px solid var(--border); color: var(--fg); background: var(--card); }
.chip.fmt { color: var(--muted); }
.chip.field { background: var(--ice); border-color: transparent; color: var(--ice-fg); }
.chip.rec { background: var(--rec); border-color: transparent; color: var(--rec-fg); }
.chip.lock { background: var(--surface); border-color: transparent; color: var(--muted); }
.chip.conv { background: var(--ice); border-color: #9cc7d3; color: var(--ice-fg); font-weight: 600; }
.chip.cur { background: var(--primary); border-color: transparent; color: var(--primary-fg); }
.note { font-size: .8125rem; line-height: 1.25rem; color: var(--muted); margin: 0; }
.amber { display: flex; gap: 6px; align-items: flex-start; font-size: .8125rem; line-height: 1.25rem; color: var(--warning); background: var(--warning-surface); border-radius: var(--r); padding: 6px 8px; }
.err { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .8125rem; color: var(--destructive); background: var(--destructive-surface); border-radius: var(--r); padding: 6px 8px; }

/* ---------- region (the creation card) ---------- */
.region { background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
.region-head { padding: 20px 24px 18px; border-block-end: 1px solid var(--border); display: grid; gap: 14px; }
.steps ol { list-style: none; margin: 0; padding: 0; display: flex; gap: 20px; flex-wrap: wrap; color: var(--muted); font-size: .8125rem; }
.steps li { display: flex; align-items: center; gap: 6px; }
.steps li .n { inline-size: 20px; block-size: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .6875rem; font-weight: 600; border: 1px solid var(--border); }
.steps li[aria-current] { color: var(--fg); font-weight: 600; }
.steps li[aria-current] .n { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.steps li.done .n { background: var(--success-surface); color: var(--success); border-color: transparent; }
.titlerow { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
.titlerow h1 { margin: 0; font-size: 1.5rem; line-height: 1.875rem; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.goalsw { position: relative; }
.goalsw > .btn { block-size: var(--ctl-sm); font-size: .8125rem; gap: 4px; }
.goalsw > .btn .k { color: var(--muted); font-weight: 400; }
.menu-pop { position: absolute; z-index: 30; inset-block-start: calc(100% + 4px); inset-inline-start: 0; inline-size: min(22rem, calc(100cqw - 32px)); background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 12px 32px -12px rgb(48 39 32 / .35); padding: 6px; display: grid; gap: 2px; }
.menu-pop button { display: grid; grid-template-columns: 18px 1fr; gap: 2px 8px; text-align: start; border: 0; background: transparent; border-radius: var(--r); padding: 8px; cursor: pointer; }
.menu-pop button:hover { background: var(--surface); }
.menu-pop button b { font-weight: 600; grid-column: 2; }
.menu-pop button span { grid-column: 2; font-size: .8125rem; color: var(--muted); }
.menu-pop button svg { grid-row: 1; grid-column: 1; margin-block-start: 2px; color: var(--action); }
.region-body { padding: 18px 24px 24px; display: grid; gap: 18px; }
.region-body > *, .region-head > *, .toolbar > *, .trow > *, .dlg .gwrap > *, .boards > *, .board > * { min-inline-size: 0; }
.trow .field .seg { overflow-x: auto; scrollbar-width: none; max-inline-size: 100%; }
.region-foot { border-block-start: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
@container app (max-width: 782px) {
  .region-head, .region-body { padding-inline: 14px; }
  .region-foot { padding-inline: 14px; justify-content: flex-start; }
  .titlerow h1 { font-size: 1.25rem; line-height: 1.6rem; }
}
.pinned { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--ice); color: var(--ice-fg); border-radius: var(--r); padding: 8px 12px; font-size: .8125rem; }

/* ---------- collections shelf ---------- */
.shelf { display: grid; gap: 10px; }
.shelf-head { display: flex; align-items: center; gap: 10px; }
.shelf-head h2 { margin: 0; font-size: 1rem; line-height: 1.25rem; font-weight: 600; }
.shelf-head .btn { margin-inline-start: auto; }
.shelf-row { display: grid; grid-auto-flow: column; grid-auto-columns: 16.5rem; gap: 12px; overflow-x: auto; padding-block-end: 4px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
@container app (max-width: 782px) { .shelf-row { grid-auto-columns: 78%; } }
.ct { scroll-snap-align: start; position: relative; border: 1px solid var(--border); border-radius: 8px; background: var(--card); display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 10px; align-items: center; }
.ct[aria-pressed="true"] { border-color: var(--action); box-shadow: inset 0 0 0 1px var(--action); background: #f5fafb; }
.ct .hit { position: absolute; inset: 0; border: 0; background: transparent; border-radius: 8px; cursor: pointer; }
.ct .cov { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; inline-size: 92px; }
.ct .cov > * { border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px var(--border); }
.ct .cov > :first-child { grid-column: 1 / -1; }
.ct .txt { min-inline-size: 0; display: grid; gap: 2px; padding-inline-end: 22px; }
.ct .txt b { font-weight: 600; font-size: .875rem; line-height: 1.2rem; text-wrap: balance; }
.ct .txt span { font-size: .75rem; color: var(--muted); }
.ct .txt .season { color: var(--ice-fg); font-weight: 600; }
.ct .x { position: absolute; inset-block-start: 4px; inset-inline-end: 4px; z-index: 1; inline-size: 28px; block-size: 28px; border-radius: var(--r); border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.ct .x:hover { background: var(--surface); color: var(--fg); }
@media (pointer: coarse) { .ct .x { inline-size: 44px; block-size: 44px; inset-block-start: 0; inset-inline-end: 0; } }
.shelf-off { display: flex; align-items: center; gap: 8px; font-size: .8125rem; color: var(--muted); }
.colbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: #f5fafb; border: 1px solid #c6dfe6; border-radius: 8px; padding: 10px 12px; }
.colbar .t { display: grid; gap: 1px; flex: 1 1 18rem; min-inline-size: 0; }
.colbar .t b { font-weight: 600; }
.colbar .t span { font-size: .8125rem; color: var(--muted); }

/* ---------- toolbar ---------- */
.toolbar { display: grid; gap: 10px; }
.trow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.trow .count { margin-inline-start: auto; font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabs { overflow-x: auto; max-inline-size: 100%; scrollbar-width: none; }
.more { position: relative; }
.more .menu-pop { inline-size: 17rem; padding: 12px; gap: 12px; inset-inline-start: auto; inset-inline-end: 0; }
.more .menu-pop label { display: flex; gap: 8px; align-items: center; font-size: .8125rem; }
.more .menu-pop .grp { display: grid; gap: 6px; }
.more .menu-pop .grp > span { font-size: .75rem; font-weight: 600; color: var(--muted); }
.active { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip.rm { cursor: pointer; background: var(--ice); border-color: transparent; color: var(--ice-fg); block-size: 26px; padding-inline: 10px 6px; }
.chip.rm:hover { background: #cfe5ec; }
@media (pointer: coarse) { .chip.rm { min-block-size: 44px; } }
.more .menu-pop .grp .select { inline-size: 100%; }
@container app (max-width: 782px) { .more .menu-pop { inset-inline-start: 0; inset-inline-end: auto; inline-size: min(17rem, calc(100cqw - 40px)); } }
.more .badge { min-inline-size: 18px; block-size: 18px; border-radius: 9px; background: var(--action); color: #fff; font-size: .6875rem; display: inline-grid; place-items: center; padding-inline: 4px; }
@container app (max-width: 782px) {
  .trow { gap: 8px; }
  .trow .field { flex: 1 1 100%; justify-content: space-between; }
  .trow .field .seg { overflow-x: auto; max-inline-size: 75%; }
  .trow .count { margin-inline-start: 0; }
  .tabs { flex: 1 1 100%; }
}

/* ---------- gallery grid + card ---------- */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@container app (max-width: 1180px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container app (max-width: 620px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.gc { border: 1px solid var(--border); border-radius: 8px; background: var(--card); overflow: hidden; display: flex; flex-direction: column; content-visibility: auto; contain-intrinsic-size: auto 420px; }
.gc .sw { position: relative; border-block-end: 1px solid var(--border); }
.gc .sw .hit { position: absolute; inset: 0; border: 0; background: transparent; cursor: zoom-in; z-index: 2; }
.gc .sw .hit:focus-visible { outline-offset: -3px; }
.gc .bd { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.gc .tt { display: flex; align-items: flex-start; gap: 6px; }
.gc h3 { margin: 0; font-size: .9375rem; line-height: 1.3rem; font-weight: 600; flex: 1; min-inline-size: 0; text-wrap: balance; }
.gc .star { inline-size: 28px; block-size: 28px; margin-block: -4px; margin-inline-end: -6px; border: 0; background: transparent; border-radius: var(--r); color: var(--muted); display: grid; place-items: center; cursor: pointer; flex: none; }
.gc .star:hover { background: var(--surface); }
.gc .star[aria-pressed="true"] { color: #b7791f; }
.gc .star[aria-pressed="true"] svg { fill: currentColor; }
@media (pointer: coarse) { .gc .star { inline-size: 44px; block-size: 44px; margin-block: -12px; } }
.gc .mt { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.gc .ac { margin-block-start: auto; display: flex; align-items: center; gap: 8px; padding-block-start: 3px; }
.consent { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; border: 1px dashed var(--input); border-radius: 8px; padding: 18px; background: var(--card); }
.consent .ic { inline-size: 40px; block-size: 40px; border-radius: 8px; background: var(--ice); color: var(--ice-fg); display: grid; place-items: center; }
.consent h3 { margin: 0 0 4px; font-size: 1rem; font-weight: 600; }
.consent .row { display: flex; gap: 8px; flex-wrap: wrap; margin-block-start: 12px; }
.consent p { max-inline-size: 68ch; }
.pager { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: .8125rem; color: var(--muted); }
.empty { grid-column: 1 / -1; display: grid; justify-items: center; text-align: center; gap: 8px; padding: 48px 16px; }
.empty .ic { inline-size: 44px; block-size: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--muted); }
.empty h3 { margin: 0; font-size: 1rem; font-weight: 600; }

/* ---------- THE STAGE — one way to draw a design ---------- */
.stg { position: relative; overflow: hidden; inline-size: 100%; aspect-ratio: 4 / 3; background: var(--stage); }
.stg.inspect { aspect-ratio: 16 / 10; }
.stg.canvas { aspect-ratio: auto; block-size: 100%; }
.stg.fixed { aspect-ratio: auto; }
.stg.actual { overflow: auto; }
.stg .page { position: absolute; top: 0; left: 0; inline-size: 100%; block-size: 100%; container-type: size; background: var(--ghost-page); overflow: hidden; }
.stg.mobile .page { inline-size: 360px; block-size: 720px; transform-origin: 0 0; border-radius: 22px; box-shadow: 0 0 0 1px var(--border), 0 10px 30px -14px rgb(48 39 32 / .4); }
.stg.mobile { background: var(--stage); }
.gp { position: absolute; inset: 0; padding: 3.6cqw 6cqw; display: flex; flex-direction: column; gap: 2.6cqw; }
.gp-head { display: flex; align-items: center; gap: 3cqw; padding-block-end: 2.4cqw; border-block-end: max(1px, .25cqw) solid var(--ghost-soft); }
.gp-head .lg { inline-size: 10cqw; block-size: 2.8cqw; border-radius: .7cqw; background: var(--ghost-ink); }
.gp-head i { inline-size: 6.5cqw; block-size: 1.3cqw; border-radius: 1cqw; background: var(--ghost-soft); }
.gp-head i:nth-of-type(1) { margin-inline-start: auto; }
.gp-hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 5cqw; align-items: center; padding-block: 1.5cqw; }
.gp-hero .tx { display: grid; gap: 1.8cqw; }
.gp-hero .tx i { block-size: 3.2cqw; border-radius: .8cqw; background: var(--ghost-ink); }
.gp-hero .tx i:nth-child(2) { inline-size: 70%; }
.gp-hero .tx i:nth-child(3) { block-size: 1.4cqw; inline-size: 85%; background: var(--ghost-soft); margin-block-start: 1cqw; }
.gp-hero .tx i:nth-child(4) { block-size: 1.4cqw; inline-size: 60%; background: var(--ghost-soft); }
.gp-hero .im { aspect-ratio: 4 / 3; border-radius: 1.2cqw; background: var(--ghost-soft); }
.gp-lines { display: grid; gap: 2.2cqw; }
.gp-lines i { block-size: 1.4cqw; border-radius: 1cqw; background: var(--ghost-soft); }
.gp-lines i:nth-child(3n+2) { inline-size: 92%; }
.gp-lines i:nth-child(4n) { inline-size: 64%; }
.gp-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3cqw; }
.gp-cols i { aspect-ratio: 1; border-radius: 1cqw; background: var(--ghost-soft); }

}

    ['Newer revision available', card(ex('guide-download', 'ready'), 'newer')],
    ['Filters match nothing', '<div class="region"><div class="empty"><div class="ic">' + ic('empty') + '</div><h3>No templates match</h3><p class="note">Try fewer filters or another word.</p><button class="btn">Clear filters</button></div></div>'],
    ['Goal with no templates', '<div class="region"><div class="empty"><div class="ic">' + ic('empty') + '</div><h3>No templates for this goal yet</h3><p class="note">Start from a blank design instead.</p><button class="btn pri">Choose a design myself</button></div></div>'],
    ['Came from a ?design= link', '<div class="pinned"><strong>Starting from “Punched ticket”</strong><span>Only the goals this design serves are offered.</span><button class="btn sm">Show every template</button></div>'],
  ];
  main.innerHTML = '<div class="boards"><section class="board"><h2>Card and gallery states</h2><p class="note">One card anatomy for every state: name and ★, a metadata row, then one action. Amber notes are about this site; the grey lock is about the plan. They never share a sentence.</p><div class="states">' +
    figs.map(function (f) { return '<figure><figcaption>' + f[0] + '</figcaption>' + f[1] + '</figure>'; }).join('') + '</div></section></div>';
  var list = ['first-order-receipt', 'bf-blackout-strip', 'sale-deadline', 'cart-straight-away', 'guide-download'].map(function (id) { return { e: BY[id] }; }).filter(function (x) { return x.e; });
  main.querySelectorAll('[data-card]').forEach(function (card) { var e = BY[card.dataset.card]; if (e) card.querySelector('.sw').prepend(stage(e, 'card', { eager: true, source: e.id === 'first-order-receipt' || e.id === 'bf-blackout-strip' ? 'image' : 'live' })); });
}

/* ======================= shell + prototype bar ======================= */
var frame = document.getElementById('frame'), layer = document.getElementById('layer'), proto = document.getElementById('proto');
function render() {
  layer.innerHTML = '';
  frame.className = 'frame' + (S.width === 360 ? ' w360' : '');
  frame.setAttribute('dir', S.dir);
  var navOn = S.screen === 'change' ? 'Campaigns' : 'Campaigns';
  frame.innerHTML = '<div class="wpbar"><b>⌂</b><b>My Shop</b><span>+ New</span></div><div class="wpwrap"><div class="wpside"><div>Dashboard</div><div>Posts</div><div>Media</div><div>Pages</div><div class="on">WConvert</div><div class="sub on">Campaigns</div><div class="sub">Leads</div><div class="sub">Settings</div><div>WooCommerce</div><div>Appearance</div><div>Plugins</div><div>Settings</div></div>' +
    '<div class="wpmain"><header class="wch"><span class="brand"><i></i>WConvert</span><nav><span>Dashboard</span><b>' + navOn + '</b><span>Leads</span><span>Destinations</span><span>Settings</span><span>Help</span></nav><button class="btn icon ghost menu" aria-label="Menu">' + ic('menu') + '</button></header><main class="' + (S.screen === 'change' ? '' : 'content') + '" id="main"></main></div></div>';
  var main = frame.querySelector('#main');
  ({ choose: renderChoose, change: renderChange, stage: renderStage, surfaces: renderSurfaces, states: renderStates })[S.screen](main);
  if (S.inspect) openInspect();
  if (S.toast) { layer.appendChild(el('<div class="toast" role="status">' + esc(S.toast) + '</div>')); }
  frame.querySelectorAll('svg.rtl-flip').forEach(function (s) { if (S.dir === 'rtl') s.style.transform = 'scaleX(-1)'; });
  renderProto();
}
function renderProto() {
  var g = function (key, items) { return '<div class="g" role="group" aria-label="' + key + '">' + items.map(function (it) { return '<button data-p="' + key + '" data-v="' + it[0] + '" aria-pressed="' + (String(S[key]) === String(it[0])) + '">' + it[1] + '</button>'; }).join('') + '</div>'; };
  var list = S.screen === 'choose' ? setupCards() : designCards();
  var locked = list.filter(function (x) { return x.a === 'locked'; }).length, online = list.filter(function (x) { return x.a === 'install'; }).length;
  proto.innerHTML = '<span class="pl">Prototype</span><button class="arrow" data-p="prev" aria-label="Previous screen">‹</button>' + g('screen', SCREENS) + '<button class="arrow" data-p="next" aria-label="Next screen">›</button>' +
    '<select aria-label="Site" data-p="site">' + SITES.map(function (s) { return '<option value="' + s[0] + '"' + (S.site === s[0] ? ' selected' : '') + '>' + s[1] + '</option>'; }).join('') + '</select>' +
    (S.screen === 'choose' ? '<select aria-label="Came from" data-p="entry">' + ENTRIES.map(function (s) { return '<option value="' + s[0] + '"' + (S.entry === s[0] ? ' selected' : '') + '>' + s[1] + '</option>'; }).join('') + '</select>' : '') +
    g('width', [[1440, '1440'], [360, '360']]) + g('dir', [['ltr', 'LTR'], ['rtl', 'RTL']]) + g('mark', [['false', 'Pictures unmarked'], ['true', 'Mark pictures']]) +
    '<span class="readout">' + (S.screen === 'choose' || S.screen === 'change' ? list.length + ' cards · ' + (list.length - locked - online) + ' on this site · ' + online + ' online (Use installs) · ' + locked + ' locked' : 'renderer: shipping bundle · ' + C.length + ' real setups') + '</span>';
}

/* ======================= events ======================= */
function setScreen(s) { S.screen = s; S.inspect = null; S.pop = null; try { history.replaceState(null, '', '#' + s); } catch (e) {} render(); window.scrollTo(0, 0); }
proto.addEventListener('click', function (ev) {
  var b = ev.target.closest('button[data-p]'); if (!b) return;
  var p = b.dataset.p, v = b.dataset.v;
  if (p === 'prev' || p === 'next') { var i = SCREENS.findIndex(function (s) { return s[0] === S.screen; }); setScreen(SCREENS[(i + (p === 'next' ? 1 : SCREENS.length - 1)) % SCREENS.length][0]); return; }
  if (p === 'screen') { setScreen(v); return; }
  S[p] = p === 'width' ? +v : p === 'mark' ? v === 'true' : v; render();
});
proto.addEventListener('change', function (ev) {
  var p = ev.target.dataset.p, v = ev.target.value;
  if (p === 'site') { S.site = v; S.consent = null; S.plan = 'all'; S.ed.plan = 'all'; S.page = 0; if (!isPro() && goalOf(S.goal).tier === 'pro') S.goal = 'grow_email_list'; resetFmt(); }
  if (p === 'entry') { setEntry(v); }
  render();
});
function resetFmt() { S.fmt = 'all'; S.ed.fmt = 'all'; }
function setEntry(v) {
  S.entry = v; S.page = 0; S.col = null; S.stage = 'any'; resetFmt();
  if (v === 'occasion') { S.goal = 'promote_offer'; S.col = 'halloween-2026'; S.toast = 'From the Halloween occasion: dates prefilled, collection chosen.'; clearToast(); }
  if (v === 'design') { S.goal = 'grow_email_list'; }
}
var toastTimer;
function clearToast() { clearTimeout(toastTimer); toastTimer = setTimeout(function () { S.toast = null; var t = layer.querySelector('.toast'); if (t) t.remove(); }, 3200); }
function toast(m) { S.toast = m; var t = layer.querySelector('.toast'); if (t) t.remove(); layer.appendChild(el('<div class="toast" role="status">' + esc(m) + '</div>')); clearToast(); }
var opener = null;

document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-act]'); if (!b || b.closest('#proto')) return;
  var act = b.dataset.act, v = b.dataset.v;
  if (act === 'ovclose') { if (ev.target !== b) return; act = S.inspect ? 'inclose' : 'edclose'; }
  if (b.tagName === 'A' && act === 'noop') ev.preventDefault();
  var ed = b.dataset.ctx === 'ed';
  switch (act) {
    case 'pop': S.pop = S.pop === v ? null : v; break;
    case 'goal': S.goal = v; S.pop = null; S.col = null; S.page = 0; resetFmt(); S.asks = 'any'; break;
    case 'set': if (ed) { S.ed[b.dataset.k] = v; S.ed.page = 0; } else { S[b.dataset.k] = v; S.page = 0; } break;
    case 'col': S.col = v || null; S.stage = 'any'; S.page = 0; if (S.col) S.fmt = 'all'; break;
    case 'hide': S.hidden[v] = 1; if (S.col === v) S.col = null; toast('Collection hidden. Show it again from “Show 1 hidden”.'); break;
    case 'unhide': S.hidden = {}; break;
    case 'shelf': S.shelfOff = v === 'off'; if (S.shelfOff) S.col = null; break;
    case 'clear': S.q = ''; S.fmt = 'all'; S.asks = 'any'; S.biz = 'any'; S.plan = 'all'; S.saved = false; S.col = null; S.page = 0; break;
    case 'edclear': S.ed.q = ''; S.ed.fmt = 'all'; S.ed.asks = 'any'; S.ed.plan = 'all'; S.ed.saved = false; S.ed.more = {}; S.ed.page = 0; break;
    case 'page': S.page += +v; render(); window.scrollTo(0, 0); return;
    case 'edpage': S.ed.page += +v; break;
    case 'unset':
      var k = b.dataset.k, o = ed ? S.ed : S;
      if (k === 'asks') o.asks = 'any'; else if (k === 'biz') S.biz = 'any'; else if (k === 'saved') o.saved = false; else if (k.indexOf('more.') === 0) delete S.ed.more[k.slice(5)];
      o.page = 0; break;
    case 'fav': S.fav[b.dataset.id] = !S.fav[b.dataset.id]; b.setAttribute('aria-pressed', String(!!S.fav[b.dataset.id])); return;
    case 'consent': S.consent = v; toast(v === 'yes' ? 'Online templates are on.' : 'No online templates. You can turn the library on in Settings.'); break;
    case 'inspect': opener = b; S.inspect = { id: b.dataset.id, ctx: b.dataset.ctx }; S.step = 0; S.zoom = 'fit'; S.dev = 'desktop'; break;
    case 'inclose': S.inspect = null; render(); if (opener && document.body.contains(opener)) opener.focus(); else { var c = document.querySelector('[data-card="' + (opener && opener.dataset.id) + '"] .hit'); if (c) c.focus(); } return;
    case 'dev': S.dev = v; break;
    case 'zoom': S.zoom = v; break;
    case 'step': S.step = +v; break;
    case 'use': use(b.dataset.id, ed); return;
    case 'edopen': S.ed.open = true; break;
    case 'edclose': S.ed.open = false; S.inspect = null; break;
    case 'eddev': S.ed.dev = v; break;
    case 'toast': toast(v); return;
    default: return;
  }
  render();
});
document.addEventListener('input', function (ev) {
  var t = ev.target; if (!t.dataset || !t.dataset.act) return;
  if (t.dataset.act === 'q' || t.dataset.act === 'edq') {
    if (t.dataset.act === 'q') { S.q = t.value; S.page = 0; } else { S.ed.q = t.value; S.ed.page = 0; }
    var id = t.id, pos = t.selectionStart; render(); var n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
  }
});
document.addEventListener('change', function (ev) {
  var t = ev.target; if (!t.dataset || !t.dataset.act || t.closest('#proto')) return;
  var a = t.dataset.act;
  if (a === 'biz') { S.biz = t.value; S.page = 0; }
  else if (a === 'fmtsel') { if (t.dataset.ctx === 'ed') { S.ed.fmt = t.value; S.ed.page = 0; } else { S.fmt = t.value; S.page = 0; } }
  else if (a === 'asks') { if (t.dataset.ctx === 'ed') { S.ed.asks = t.value; S.ed.page = 0; } else { S.asks = t.value; S.page = 0; } }
  else if (a === 'saved') S.saved = t.checked;
  else if (a === 'edsaved') S.ed.saved = t.checked;
  else if (a === 'edimg') S.ed.more.img = t.checked;
  else if (a === 'edmore') S.ed.more[t.dataset.k] = t.value;
  else if (a === 'edfit') { S.ed.fit = t.value; S.ed.page = 0; }
  else return;
  render();
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') { if (S.inspect) { S.inspect = null; render(); if (opener && document.body.contains(opener)) opener.focus(); return; } if (S.pop) { S.pop = null; render(); return; } if (S.screen === 'change' && S.ed.open) { S.ed.open = false; render(); return; } }
  var tag = (document.activeElement || {}).tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (document.activeElement && document.activeElement.isContentEditable)) return;
  if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') { var i = SCREENS.findIndex(function (s) { return s[0] === S.screen; }); setScreen(SCREENS[(i + (ev.key === 'ArrowRight' ? 1 : SCREENS.length - 1)) % SCREENS.length][0]); }
});
function use(id, ed) {
  var list = ed ? designCards() : setupCards(), x = list.filter(function (y) { return y.e.id === id; })[0]; if (!x) return;
  var go = function () {
    S.busy = null; S.inspect = null;
    if (ed) {
      var c = C.filter(function (c) { return c.tpl === id && c.goal === BY[S.ed.current].goal; })[0] || C.filter(function (c) { return c.tpl === id; })[0];
      S.ed.current = c.id; S.ed.open = false; render(); toast('Template changed. Your words came with you.');
    } else {
      S.ed.current = id; S.ed.open = false; setScreen('change'); toast('Draft created from “' + x.e.name + '”.');
    }
  };
  if (x.a === 'install') { S.busy = id; S.failed = null; render(); setTimeout(go, 900); } else go();
}

render();
})();
</script>
