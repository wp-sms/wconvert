<title>WConvert Design Bench</title>

<!--
  The Design Bench — the RETURN PATH.

  `tools/design-system` is one-way: repo → Claude Design. Designs have to come
  back as JSON, and this is what they come back through. Paste a tree in, drive
  every token, judge it in its real container at three widths in both
  directions, copy it out.

  This file is a TEMPLATE. `build/bench.mjs` replaces the three markers below
  with the shipping renderer, the shipping manifest and the shipping themes,
  and writes `out/bench.html` — which is what gets published. The renderer is
  INLINED because an Artifact cannot load an external script outside its CDN
  allowlist, and inlining is also what makes the file work from `file://` with
  no server.

  Authored as page CONTENT — no doctype, no <html>, no <head>, no <body> — so
  the published wrapper supplies them.
-->

<style>
  :root {
    color-scheme: light;
    --ink: #0f172a;
    --ink-2: #475569;
    --ink-3: #94a3b8;
    --line: #e2e8f0;
    --panel: #ffffff;
    --ground: #f1f5f9;
    --tint: #2563eb;
    --stage: #cbd5e1;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --ink: #e2e8f0;
      --ink-2: #94a3b8;
      --ink-3: #64748b;
      --line: #1e293b;
      --panel: #0f172a;
      --ground: #020617;
      --tint: #38bdf8;
      --stage: #1e293b;
    }
  }

  :root[data-theme='dark'] {
    --ink: #e2e8f0;
    --ink-2: #94a3b8;
    --ink-3: #64748b;
    --line: #1e293b;
    --panel: #0f172a;
    --ground: #020617;
    --tint: #38bdf8;
    --stage: #1e293b;
  }

  /*
    Two roles, and the split follows the subject rather than taste: the chrome
    is a UI sans, and every VALUE on this page — a token, a hex, a length, a
    tree — is CSS or JSON, so it is set in mono. System stacks on both, because
    this file has to render from `file://` during the build and a webfont would
    silently fall back there.
  */
  :root {
    --ui: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 13px/1.5 var(--ui);
    height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 22rem;
    grid-template-rows: auto minmax(0, 1fr);
  }

  header {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: .4rem .75rem;
    align-items: center;
    padding: .5rem .75rem;
    background: var(--panel);
    border-block-end: 1px solid var(--line);
  }

  /*
    The theme switcher is a SELECT and not a chip group. It was chips, which
    was right at four presets and wrong at twelve: thirteen chips wrapped onto
    a second row and pushed Reset tokens onto a line of its own, so the toolbar
    read as two unrelated bars. A control that enumerates twelve things is a
    menu.
  */
  header label {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  header select { inline-size: auto; min-inline-size: 8rem; }

  h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    margin: 0 .5rem 0 0;
  }

  .group { display: flex; gap: 2px; background: var(--ground); padding: 2px; border-radius: 7px; }

  .group button {
    font: inherit;
    font-size: 12px;
    border: 0;
    background: transparent;
    color: var(--ink-2);
    padding: .25rem .55rem;
    border-radius: 5px;
    cursor: pointer;
  }

  .group button[aria-pressed='true'] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .spacer { margin-inline-start: auto; }

  /*
    `justify-content: safe center` and NOT `place-items: center`. The page is a
    fixed viewport width — 1440px at the widest — and the stage column is
    whatever is left after the panel. Ordinary centring overflows equally on
    both sides, and the overflow on the START side is unreachable by scrolling,
    so the 1440 preview was clipped down its left edge with no way to see it.
    `safe` collapses to `start` exactly when it would otherwise overflow.
  */
  .stage-wrap {
    overflow: auto;
    padding: 1.5rem;
    display: grid;
    align-content: start;
    justify-content: safe center;
    background:
      repeating-conic-gradient(var(--stage) 0 25%, transparent 0 50%) 50% / 20px 20px;
  }

  /*
    ==========================================================================
    THE FILLER, THE BACKDROP AND THE PANEL SHARE ONE GRID CELL.
    ==========================================================================
    That is what lets all three of these be true at once: the panel floats over
    the page rather than under it, the page GROWS to whatever the panel needs
    instead of clipping it, and the panel keeps a definite containing block so
    its own `min(width, 100%)` has something real to resolve against.

    The last one is the subtle one. An absolutely positioned box is
    shrink-to-fit, so the percentage resolved against a width derived from the
    panel's own content — and `split-hero`, which asks for 38rem, collapsed to
    a stack. `capture-designs.mjs` carries the same note for the same reason.
  */
  #page.wc-container-popup { display: grid; padding: 2rem 1rem; }
  /*
    The backdrop is excluded from the shared cell on purpose. An absolutely
    positioned grid child WITH a definite `grid-area` takes that area as its
    containing block, so `inset: 0` stopped at the content box and left the
    page's own padding uncovered — a white band across the top of every popup
    preview. Left as `auto` it resolves against the grid container's padding
    box, which is the whole page.
  */
  #page.wc-container-popup > :not(.backdrop) { grid-area: 1 / 1; }
  #page.wc-container-popup > .wc-box { place-self: center; }

  /* The page the design is served on. Its width IS the viewport switcher. */
  #page {
    position: relative;
    background: #fff;
    color: #111;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .18);
    overflow: hidden;
    transition: inline-size 160ms ease;
  }

  #page .filler { padding: 1.5rem 1.75rem; color: #64748b; font: 15px/1.75 Georgia, 'Times New Roman', serif; }
  #page .filler h2 { color: #1e293b; font-size: 22px; line-height: 1.2; margin: 0 0 .6rem; }
  #page .filler p { margin: 0 0 .8rem; max-width: 60ch; }

  /*
    The backdrop is a LAYER over the page, not the page's own background.
    Painting it on `#page` meant a popup preview was a flat grey rectangle with
    no page in it at all — so nothing conveyed how big the design is relative
    to what it covers, which is the one thing a stage exists to show.
  */
  #page .backdrop { position: absolute; inset: 0; }

  aside {
    overflow: auto;
    background: var(--panel);
    border-inline-start: 1px solid var(--line);
    padding: .875rem;
  }

  aside h2 {
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 1rem 0 .4rem;
  }

  aside h2:first-child { margin-block-start: 0; }

  /*
    A fixed track for the swatch or the menu, so every text box on the panel
    starts and ends on the same two lines. It was `display: flex`, which sized
    each control to its own content — so a row with a colour swatch, a row with
    a font menu and a row with neither all had their text box in a different
    place, and twenty-two of them read as a ragged edge rather than a list.
  */
  .token {
    display: grid;
    grid-template-columns: 6.5rem minmax(0, 1fr);
    gap: .4rem;
    align-items: center;
    margin-block-end: .35rem;
  }
  .token label { font-size: 11px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
  .token .pair { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: .3rem; min-width: 0; align-items: center; }
  .token .pair--plain { grid-template-columns: minmax(0, 1fr); }

  input[type='text'], textarea, select {
    font-family: var(--mono);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    width: 100%;
    min-width: 0;
    padding: .25rem .4rem;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--ground);
    color: var(--ink);
  }

  input[type='color'] { inline-size: 100%; block-size: 1.7rem; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: none; }

  textarea { font-size: 11px; line-height: 1.5; resize: vertical; min-block-size: 16rem; }

  /* The token's own name is a name, not a value, so it stays in the UI face. */
  .token label { font-family: var(--ui); }

  /* Keyboard focus, visible everywhere. */
  :is(button, input, select, textarea):focus-visible {
    outline: 2px solid var(--tint);
    outline-offset: 1px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  .row { display: flex; gap: .35rem; align-items: center; margin-block-end: .4rem; }

  .act {
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: .3rem .6rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--ground);
    color: var(--ink);
    cursor: pointer;
  }

  .act.primary { background: var(--tint); border-color: var(--tint); color: #fff; }

  .note { font-size: 11px; color: var(--ink-3); margin: .3rem 0 0; }
  .note b { color: #dc2626; }

  @media (max-width: 60rem) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) 18rem; }
    aside { border-inline-start: 0; border-block-start: 1px solid var(--line); }
  }
</style>

<header>
  <h1>Design Bench</h1>

  <div class="group" id="containers"></div>
  <div class="group" id="viewports"></div>
  <div class="group" id="steps"></div>
  <div class="group" id="directions"></div>

  <label>Theme <select id="themes"></select></label>

  <div class="spacer"></div>
  <button class="act" id="reset">Reset tokens</button>
</header>

<div class="stage-wrap"><div id="page"></div></div>

<aside>
  <h2>Entry JSON</h2>
  <div class="row">
    <button class="act primary" id="apply">Apply</button>
    <button class="act" id="copy">Copy out</button>
    <button class="act" id="pretty">Format</button>
  </div>
  <textarea id="json" rows="14" spellcheck="false"></textarea>
  <p class="note" id="status"></p>

  <div id="controls"></div>
</aside>

<script>/*__RENDERER__*/</script>

<script id="wc-manifest" type="application/json">/*__MANIFEST__*/</script>
<script id="wc-seed" type="application/json">/*__SEED__*/</script>

<script>
  (function () {
    'use strict';

    var manifest = JSON.parse(document.getElementById('wc-manifest').textContent);
    var seed = JSON.parse(document.getElementById('wc-seed').textContent);
    var themes = WConvertRenderer.themePresets();

    var VIEWPORTS = [320, 768, 1440];

    /*
      The four containers.

      The design is mounted inside `.wc-box`, which is a WRAPPER around the
      shadow host and never the host itself: SHADOW_CSS carries an
      all:initial !important rule on :host, and an !important declaration in
      :host beats a normal one from outside — so position:absolute set on the
      host is silently reverted to static, and a bar renders full width at the
      top of the page. The shipping containers wrap for the same reason.

      The geometry mirrors free's DIALOG_ARMOUR and Pro's PLACEMENT.
      `build/containers.mjs` asserts that mirror against their source.
    */
    var CONTAINERS = {
      /*
        No `position:absolute;inset:0` here, unlike the capture harness: there
        the popup container is a CHILD of the frame, and here `#page` IS the
        page. Absolutely positioning it took it out of the stage's grid and
        pinned the popup to the left edge instead of centring it.
      */
      /*
        ONE grid cell, holding the filler, the backdrop and the panel — see
        `.wc-container-popup` in the stylesheet. Absolute centring was the
        first attempt and it was wrong twice: an absolutely positioned box is
        shrink-to-fit, so the panel's own `min(width, 100%)` resolved against
        its own content and `split-hero` collapsed to a stack; and it took the
        panel out of flow, so a design taller than the page was clipped top and
        bottom with nowhere to grow.
      */
      popup: { page: '', box: '' },
      fullscreen: { page: '', box: 'position:absolute;inset:0;overflow:auto' },
      inline: { page: '', box: 'padding:1.5rem 1rem' },
      floating_bar: {
        page: '',
        box: 'position:absolute;inset-block-start:auto;inset-block-end:0;inset-inline-start:0;inset-inline-end:0',
      },
      slide_in: {
        page: '',
        box:
          'position:absolute;inset-block-start:auto;inset-block-end:1rem;' +
          'inset-inline-start:auto;inset-inline-end:1rem;inline-size:min(100% - 2rem, 26rem)',
      },
    };

    var state = {
      entry: seed,
      tokens: Object.assign({}, seed.tokens),
      container: seed.display_type || 'popup',
      viewport: 768,
      step: 0,
      direction: 'ltr',
    };

    // ---------------------------------------------------------------- header

    function segmented(id, values, label, read, write) {
      var host = document.getElementById(id);

      host.replaceChildren();

      values.forEach(function (value) {
        var button = document.createElement('button');

        button.type = 'button';
        button.textContent = label(value);
        button.setAttribute('aria-pressed', String(read() === value));
        button.onclick = function () {
          write(value);
          draw();
        };
        host.appendChild(button);
      });
    }

    function drawHeader() {
      segmented('containers', Object.keys(CONTAINERS), function (v) { return v.replace('_', ' '); },
        function () { return state.container; }, function (v) { state.container = v; });

      segmented('viewports', VIEWPORTS, function (v) { return v + 'px'; },
        function () { return state.viewport; }, function (v) { state.viewport = v; });

      var steps = [];

      for (var i = 0; i < (state.entry.tree.steps || []).length; i++) { steps.push(i); }

      segmented('steps', steps, function (v) { return 'step ' + (v + 1); },
        function () { return state.step; }, function (v) { state.step = v; });

      segmented('directions', ['ltr', 'rtl'], function (v) { return v.toUpperCase(); },
        function () { return state.direction; }, function (v) { state.direction = v; });

      var picker = document.getElementById('themes');

      picker.replaceChildren();

      [{ id: '', label: 'The design\u2019s own' }].concat(themes).forEach(function (theme) {
        var option = document.createElement('option');

        option.value = theme.id;
        option.textContent = theme.label;
        option.selected = (state.theme || '') === theme.id;
        picker.appendChild(option);
      });

      picker.onchange = function () {
        var chosen = themes.filter(function (t) { return t.id === picker.value; })[0];

        state.theme = chosen ? chosen.id : null;
        state.tokens = Object.assign({}, state.entry.tokens, chosen ? chosen.tokens : {});
        drawControls();
        draw();
      };
    }

    // -------------------------------------------------------------- controls

    /*
      A colour picker where the value looks like a colour, a select where the
      manifest offers choices, and a text box always — read off the VALUE
      rather than a list of token names, which is the same shape the shipping
      settings panel uses, so a token added to the manifest grows a control
      here with nothing edited.

      The text box stays beside every richer control. Token values are
      unvalidated, and a control that could clobber a clamp() the merchant
      typed would be this bench deciding a design's value was written wrong.
    */
    function isHex(value) { return /^#[0-9a-f]{6}$/i.test(String(value).trim()); }

    function drawControls() {
      var host = document.getElementById('controls');

      host.replaceChildren();

      var heading = document.createElement('h2');

      heading.textContent = 'Tokens (' + Object.keys(manifest.tokens).length + ')';
      host.appendChild(heading);

      Object.keys(manifest.tokens).forEach(function (name) {
        var row = document.createElement('div');
        var label = document.createElement('label');
        var pair = document.createElement('div');
        var value = state.tokens[name] !== undefined ? state.tokens[name] : manifest.tokens[name];

        row.className = 'token';
        pair.className = 'pair';
        label.textContent = name;
        label.title = name;

        var rich = isHex(value) || manifest.choices[name] !== undefined;

        if (!rich) {
          pair.className = 'pair pair--plain';
        }

        var text = document.createElement('input');

        text.type = 'text';
        text.value = value;
        // What the token falls back to when a design does not set it. Absence
        // is a real state here — most designs set eight of the twenty-two.
        text.placeholder = manifest.tokens[name];
        text.title = name + ' — default: ' + manifest.tokens[name];
        text.oninput = function () { set(name, text.value); };

        if (isHex(value)) {
          var picker = document.createElement('input');

          picker.type = 'color';
          picker.value = value;
          picker.oninput = function () { text.value = picker.value; set(name, picker.value); };
          pair.appendChild(picker);
        }

        if (manifest.choices[name]) {
          var select = document.createElement('select');

          manifest.choices[name].forEach(function (choice) {
            var option = document.createElement('option');

            option.value = choice;
            option.textContent = choice.length > 28 ? choice.slice(0, 26) + '…' : choice;
            option.selected = choice === value;
            select.appendChild(option);
          });

          select.onchange = function () { text.value = select.value; set(name, select.value); };
          pair.appendChild(select);
        }

        pair.appendChild(text);
        row.appendChild(label);
        row.appendChild(pair);
        host.appendChild(row);
      });
    }

    function set(name, value) {
      state.tokens[name] = value;
      state.theme = null;
      draw();
    }

    // ------------------------------------------------------------------ draw

    function draw() {
      var page = document.getElementById('page');
      var container = CONTAINERS[state.container] || CONTAINERS.popup;

      page.dir = state.direction;
      // The class the stylesheet's own container rules key off. The inline
      // `cssText` below carries what CONTAINERS declares; the class carries
      // what needs a real selector, which is anything about the page's
      // CHILDREN — a descendant is not reachable from an inline style.
      page.className = 'wc-container-' + state.container;
      page.style.cssText =
        'position:relative;inline-size:' + state.viewport + 'px;min-block-size:' +
        (state.container === 'inline' ? '0' : '620px') + ';' + container.page;
      page.replaceChildren();

      /*
        EVERY container gets a page underneath, popup included. It used to be
        skipped for popups, on the theory that a backdrop covers it — which is
        exactly backwards: with nothing behind it the preview was a flat grey
        rectangle, and how much of a page a popup covers is the single thing a
        stage exists to show.
      */
      var filler = document.createElement('div');

      filler.className = 'filler';
      filler.innerHTML =
        '<h2>The page underneath</h2>' +
        '<p>A popup covers this. A floating bar sits at the edge of it and a slide-in in the ' +
        'corner of it, both while the visitor is still reading. None of the three is judged ' +
        'fairly against an empty rectangle.</p>' +
        '<p>An inline design sits in this flow, where the merchant placed the block \u2014 so it ' +
        'covers nothing at all, and is the only one of the four a visitor never has to dismiss.</p>';
      page.appendChild(filler);

      // The backdrop is a LAYER over that page rather than the page's own
      // ground, so the words stay visible through it at whatever alpha the
      // design's `backdrop` token carries.
      if (state.container === 'popup') {
        var backdrop = document.createElement('div');

        backdrop.className = 'backdrop';
        backdrop.style.background = state.tokens.backdrop || manifest.tokens.backdrop;
        page.appendChild(backdrop);
      }

      var box = document.createElement('div');

      box.className = 'wc-box';
      box.style.cssText = container.box;

      if (state.container === 'popup') {
        box.style.inlineSize = 'min(' + (state.tokens.width || manifest.tokens.width) + ', 100%)';
      }

      var host = document.createElement('div');
      var root = host.attachShadow({ mode: 'open' });
      var style = document.createElement('style');

      style.textContent = WConvertRenderer.SHADOW_CSS;
      root.appendChild(style);

      try {
        var rendered = WConvertRenderer.render(state.entry.tree, state.tokens, state.step);
        if (state.container === 'fullscreen') WConvertRenderer.decorateFullscreen(rendered, state.tokens.width, '620px');
        root.appendChild(rendered);
        say('');
      } catch (error) {
        say('The renderer threw: ' + error.message, true);
      }

      box.appendChild(host);
      page.appendChild(box);

      drawHeader();
    }

    function say(message, bad) {
      var status = document.getElementById('status');

      status.innerHTML = bad ? '<b>' + message + '</b>' : message;
    }

    // ------------------------------------------------------------------ JSON

    var json = document.getElementById('json');

    function show(entry) {
      json.value = JSON.stringify(entry, null, 2);
    }

    document.getElementById('apply').onclick = function () {
      var decoded;

      try {
        decoded = JSON.parse(json.value);
      } catch (error) {
        return say('Not valid JSON: ' + error.message, true);
      }

      if (!decoded || !decoded.tree || !Array.isArray(decoded.tree.steps)) {
        return say('No tree.steps — a design with no `tree` becomes a Pro upsell card, silently.', true);
      }

      state.entry = decoded;
      state.tokens = Object.assign({}, decoded.tokens);
      state.theme = null;
      state.step = 0;

      if (CONTAINERS[decoded.display_type]) {
        state.container = decoded.display_type;
      }

      drawControls();
      draw();
    };

    document.getElementById('copy').onclick = function () {
      /*
        The tokens the BENCH holds, not the ones the entry arrived with — that
        is the whole point of the return path. Key order matches the library's
        own export so a copied entry diffs cleanly against a shipped one.
      */
      var out = {
        id: state.entry.id || 'untitled',
        name: state.entry.name || 'Untitled',
        display_type: state.container,
        tier: state.entry.tier || 'free',
        tokens: state.tokens,
        tree: state.entry.tree,
      };

      show(out);
      json.select();

      try {
        navigator.clipboard.writeText(JSON.stringify(out, null, 2));
        say('Copied. Run php bin/verify-templates.php before believing it exists.');
      } catch (error) {
        say('Selected — copy it by hand. (' + error.message + ')');
      }
    };

    document.getElementById('pretty').onclick = function () {
      try {
        show(JSON.parse(json.value));
        say('');
      } catch (error) {
        say('Not valid JSON: ' + error.message, true);
      }
    };

    document.getElementById('reset').onclick = function () {
      state.tokens = Object.assign({}, state.entry.tokens);
      state.theme = null;
      drawControls();
      draw();
    };

    show(seed);
    drawControls();
    draw();
  })();
</script>
