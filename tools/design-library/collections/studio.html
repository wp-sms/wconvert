<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WConvert collection studio</title>
<style>body{margin:0;font:15px/1.6 system-ui;color:#233d35;background:#f1f4ef}header,main{padding:24px;max-width:1200px;margin:auto}h1{margin:0;font-size:28px}h2{font-size:20px}label{display:inline-flex;flex-direction:column;gap:6px;margin:6px}input,select,button{font:inherit;padding:10px;border:1px solid #aab9b0;border-radius:6px;background:#fff;color:#233d35}button{cursor:pointer}#collections{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}article{border:1px solid #bdcdc4;border-radius:12px;background:#fff;padding:20px}article h2{margin-top:0}small{display:block;color:#52655a}.pair{display:flex;gap:24px;align-items:start;overflow:auto}.frame{flex:none;background:#e6eae1;padding:16px}.desktop{width:768px}.phone{width:320px}details{margin-block:20px}summary{cursor:pointer;font-weight:600}#proofs{margin-top:24px}[hidden]{display:none!important}</style>
<header><h1>Collection studio</h1><p>Preview in plugin picker — simulated context using real prepared setups. This contains public library examples and internal review status, never a customer’s account, leads or campaigns.</p>
<label>Site calendar day<input id="day" type="date"></label><label>Business<select id="business"><option value="all">All businesses</option><option value="stores">Stores</option><option value="services">Services</option><option value="publishers">Publishers & creators</option></select></label><label>Goal<select id="goal"><option value="all">All goals</option></select></label><label>Format<select id="format"><option value="all">All formats</option></select></label><label>Plan<select id="plan"><option value="free">Free</option><option value="pro">Pro</option></select></label><label>Markets<input id="markets" placeholder="GB, US"></label><label>Placement<select id="placement"><option value="featured">Featured now</option><option value="browse">Browse upcoming too</option></select></label><label>Direction<select id="direction"><option value="ltr">LTR</option><option value="rtl">RTL</option></select></label><label><input id="drafts" type="checkbox"> Include drafts for internal review</label></header>
<main><p id="counts" role="status"></p><div id="collections"></div><section id="proofs"></section></main>
<script>/*__MODEL__*/</script><script>/*__RENDERER__*/</script><script>
const {review,entries}=/*__DATA__*/;const M=WConvertDiscovery,R=WConvertRenderer,$=id=>document.getElementById(id);
$('day').value=new Date().toISOString().slice(0,10);
for(const goal of new Set(entries.map(entry=>entry.goal)))$('goal').add(new Option(goal.replaceAll('_',' '),goal));
for(const format of new Set(entries.map(entry=>entry.display_type)))$('format').add(new Option(format.replaceAll('_',' '),format));
const metadata=entries.map(entry=>({...entry,design_key:'registered:'+entry.template_id,business_types:[{id:entry.audience}],availability:entry.tier==='free'?'ready':'locked'}));
function context(){const business=$('business').value;return metadata.filter(entry=>($('goal').value==='all'||entry.goal===$('goal').value)&&($('format').value==='all'||entry.display_type===$('format').value)&&(business==='all'||entry.audience===business)).map(entry=>({...entry,availability:$('plan').value==='pro'||entry.tier==='free'?'ready':'locked'}));}
function draw(){const collections=review.compiled.filter(entry=>$('drafts').checked||entry.status==='published');const data={collections,today:$('day').value,preferences:{hidden:[],events:[],markets:$('markets').value.split(',').map(x=>x.trim().toUpperCase()).filter(Boolean)}};const matches=M.matchingCollections(data,context(),$('placement').value==='featured');$('counts').textContent=matches.length+' matching collections · actual capability availability is checked by WordPress. Drafts cannot be released.';$('collections').replaceChildren();for(const {collection,setups,designs} of matches){const article=document.createElement('article'),title=document.createElement('h2'),description=document.createElement('p'),facts=document.createElement('small'),button=document.createElement('button');title.textContent=collection.name;description.textContent=collection.description;facts.textContent=collection.status+' · '+setups.length+' setups · '+designs+' designs · preferred stage '+M.preferredStage(collection,data.today,setups);button.textContent='Inspect all screens';button.onclick=()=>proofs(collection,setups);article.append(title,description,facts,button);$('collections').append(article);}}
function proofs(collection,setups){R.disposePreview($('proofs'));$('proofs').replaceChildren();for(const entry of setups){const section=document.createElement('details');section.open=true;const title=document.createElement('summary');title.textContent=entry.name+' · '+entry.display_type;section.append(title);entry.tree.steps.forEach((screen,index)=>{for(const result of screen.results||[null]){const heading=document.createElement('h3');heading.textContent='Screen '+(index+1)+(result?' · '+result.heading:'');section.append(heading);const pair=document.createElement('div');pair.className='pair';for(const size of ['desktop','phone']){const frame=document.createElement('div');frame.className='frame '+size;frame.dir=$('direction').value;frame.dataset.setup=entry.id;frame.dataset.screen=String(index);frame.dataset.width=size==='desktop'?'768':'320';const host=document.createElement('div'),shadow=host.attachShadow({mode:'open'}),style=document.createElement('style');style.textContent=R.SHADOW_CSS;shadow.append(style);const rendered=R.render(entry.tree,entry.tokens,index);rendered.style.maxBlockSize='none';if(result){rendered.querySelector('[data-result-heading]').textContent=result.heading;rendered.querySelector('[data-result-body]').textContent=result.body;}shadow.append(rendered);R.prepareControls(rendered,shadow);frame.append(host);pair.append(frame);}section.append(pair);}});$('proofs').append(section);} $('proofs').scrollIntoView();}
for(const id of ['day','business','goal','format','plan','markets','placement','drafts','direction'])$(id).onchange=draw;draw();
</script></html>
