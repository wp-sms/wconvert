<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WConvert actual picker responsive review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf2ee;color:#243f38;font:15px/1.5 system-ui}header{padding:16px;background:#fff}h1{font-size:22px;margin:0 0 8px}label,button{display:inline-flex;gap:8px;margin:8px 12px 8px 0}select,button{font:inherit;padding:8px;background:#fff;color:inherit;border:1px solid #81938b;border-radius:6px}main{overflow:auto;padding:16px}iframe{border:1px solid #81938b;height:1200px;background:white;display:block;transform-origin:top left}pre{white-space:pre-wrap}</style>
<header><h1>Actual WordPress picker — responsive review</h1><p>Sign in to the disposable site, open Create campaign and choose a goal in the frame. This is the shipping admin in a real viewport, with the same REST endpoints. No prototype replaces it.</p>
<label>Viewport<select id="width"><option>320</option><option>390</option><option>768</option><option>1280</option></select></label><label>Magnification<select id="zoom"><option value="1">100%</option><option value="2">200%</option></select></label><label>Direction<select id="direction"><option value="ltr">LTR</option><option value="rtl">RTL</option></select></label><button id="measure">Check actual layout</button><pre id="report" aria-live="polite"></pre></header>
<main><iframe id="app" title="Actual WConvert WordPress admin" src="/wp-admin/admin.php?page=wconvert"></iframe></main>
<script>
const frame=document.getElementById('app'),width=document.getElementById('width'),zoom=document.getElementById('zoom'),direction=document.getElementById('direction');
function layout(){frame.style.width=width.value+'px';frame.style.zoom=zoom.value;if(frame.contentDocument)frame.contentDocument.documentElement.dir=direction.value;}
function measure(){const doc=frame.contentDocument,win=frame.contentWindow;if(!doc?.querySelector('#wconvert-admin'))return;const fields=[...doc.querySelectorAll('.wconvert-picker__search input')].map(input=>({height:input.getBoundingClientRect().height,font:win.getComputedStyle(input).fontSize}));const overflows=[...doc.querySelectorAll('#wconvert-admin *')].filter(el=>el.clientWidth>2&&el.scrollWidth>el.clientWidth+2&&!el.matches('input,select,.wconvert-collections__shelf')&&!el.closest('.wconvert-gallery__preview')).map(el=>({class:el.className,width:el.clientWidth,scroll:el.scrollWidth}));document.getElementById('report').textContent=JSON.stringify({viewport:win.innerWidth,pageWidth:doc.documentElement.scrollWidth,zoom:Number(zoom.value),direction:direction.value,fields,overflows},null,2);}
for(const el of[width,zoom,direction])el.onchange=()=>{layout();requestAnimationFrame(measure)};frame.onload=layout;document.getElementById('measure').onclick=measure;layout();
</script></html>
