name: PHP tests

# PHPUnit across the supported PHP range, plus MySQL checks and PHPStan.
#
#   [test]      Floor and ceiling on a pull request, every version otherwise.
#               This matrix is the ONLY list of supported versions.
#   [database]  bin/verify-*.php against real MySQL, then PHPStan (its
#               phpVersion pin in phpstan.neon.dist is the source of truth).
#
# No triggers of its own beyond a manual dispatch; ci.yml calls it behind the
# php filter.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: 'Tests · PHP ${{ matrix.php }}'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ${{ github.event_name == 'pull_request' && fromJSON('["8.1","8.4"]') || fromJSON('["8.1","8.2","8.3","8.4"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('composer.lock', 'pro/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      # composer.lock is resolved at the floor declared in composer.json, so it
      # installs cleanly on every matrix row with no platform overrides.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Pro's own manifest: the scoped licence SDK (ADR 0143). The suite loads
      # Pro's autoloader, which requires pro/packages/autoload.php.
      - name: Install Pro dependencies
        run: composer install --working-dir=pro --no-interaction --no-progress

      # composer, not vendor/bin/phpunit: the script carries --testdox, so the
      # log names each test.
      - name: PHPUnit
        run: composer test

  database:
    name: 'Database + PHPStan · WordPress 6.9 / PHP 8.2 / MySQL 8.4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, mysqli, mysqlnd
          tools: composer
          coverage: none

      # setup-php's wp-cli tool failed three runs in a row on hosted runners
      # ("Could not setup wp-cli"), token or not; a pinned release with its
      # published checksum does not depend on it.
      - name: Install WP-CLI
        run: |
          set -euo pipefail
          base=https://github.com/wp-cli/wp-cli/releases/download/v2.12.0
          curl -fsSL --retry 3 -o wp-cli.phar "$base/wp-cli-2.12.0.phar"
          echo "$(curl -fsSL --retry 3 "$base/wp-cli-2.12.0.phar.sha512" | awk '{print $1}')  wp-cli.phar" | sha512sum -c -
          sudo install -m 0755 wp-cli.phar /usr/local/bin/wp
          rm wp-cli.phar
          wp --info

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php8.2-composer-${{ hashFiles('composer.lock', 'pro/composer.lock') }}
          restore-keys: ${{ runner.os }}-php8.2-composer-

      - name: Install plugin dependencies
        id: deps
        run: |
          composer install --no-interaction --no-progress
          composer install --working-dir=pro --no-interaction --no-progress

      - name: Install disposable WordPress
        env:
          WP_PATH: ${{ runner.temp }}/wordpress
        run: |
          set -euo pipefail

          wp core download --version=6.9 --path="$WP_PATH"
          wp config create \
            --path="$WP_PATH" \
            --dbname=wordpress \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1:3306
          wp config set DISABLE_WP_CRON true --raw --path="$WP_PATH"
          wp config set WCONVERT_VERIFY_JOURNEYS true --raw --path="$WP_PATH"
          wp core install \
            --path="$WP_PATH" \
            --url=http://wconvert.test \
            --title=WConvert \
            --admin_user=admin \
            --admin_password=development-only \
            --admin_email=admin@example.test \
            --skip-email
          ln -s "$GITHUB_WORKSPACE" "$WP_PATH/wp-content/plugins/wconvert"
          wp plugin activate wconvert --path="$WP_PATH"

      - name: Verify SQL behavior against MySQL
        env:
          WP_PATH: ${{ runner.temp }}/wordpress
        run: |
          set -euo pipefail

          wp eval-file "$GITHUB_WORKSPACE/bin/verify-stats.php" --use-include --path="$WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/bin/verify-lead-log.php" --use-include --path="$WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/bin/verify-lead-search.php" --use-include --path="$WP_PATH"

          # After the three above and before anything that leaves campaigns or
          # Leads behind: the schedule verifier refuses a site with any Optin
          # row, and the destination verifier one with any Lead. Both delete
          # what they create. Stats runs first because it expects a site that
          # has never published.
          wp eval-file "$GITHUB_WORKSPACE/bin/verify-schedule.php" --use-include --path="$WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/bin/verify-destinations.php" --use-include --path="$WP_PATH"

          WCONVERT_VERIFY_BOOTSTRAP="$WP_PATH/wp-load.php" php "$GITHUB_WORKSPACE/bin/verify-capture-journeys.php"
          wp eval-file "$GITHUB_WORKSPACE/bin/verify-template-media.php" --use-include --path="$WP_PATH"

          ln -s "$GITHUB_WORKSPACE/pro" "$WP_PATH/wp-content/plugins/wconvert-pro"
          wp plugin activate wconvert-pro --path="$WP_PATH"
          WCONVERT_VERIFY_BOOTSTRAP="$WP_PATH/wp-load.php" php "$GITHUB_WORKSPACE/bin/verify-capture-journeys.php"
          wp eval-file "$GITHUB_WORKSPACE/bin/verify-template-media.php" --use-include --path="$WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/bin/verify-claims.php" --use-include --path="$WP_PATH"

      # PHPStan shares this job's PHP 8.2 and install; phpstan.neon.dist pins
      # phpVersion to the floor. Runs even when the MySQL checks failed.
      - name: PHPStan
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: composer phpstan
