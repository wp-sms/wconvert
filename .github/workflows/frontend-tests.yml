name: Frontend tests

# The build every frontend check reads, then the tests on it.
#
#   [build]   source contract, `npm run build` once, then the loader, admin and
#             POT asserts on its output. Always runs, whatever `tests` says.
#   [test]    Vitest (+ converted designs, ADR 0163), tsc, ESLint.
#   [visual]  Playwright on Playground, three legs sharing [build]'s artifact.
#
# `tests: false` runs only [build]; ci.yml passes it when the js filter
# misses. A draft skips [visual]. Legs run in the Playwright container because
# --with-deps fetches fonts from a throttled apt mirror. Why: ADR 0029, "The
# pull-request workflow". No triggers of its own beyond a manual dispatch.

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Run Vitest and the visual suites, not only the build and its contracts'
        type: boolean
        default: true
  workflow_call:
    inputs:
      tests:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Vitest covers free's tree and Pro's; Pro's loader tests live under pro/ so
  # no test importing a Pro module lands in resources/, a source-contract scan
  # root. The same run dumps every converted design for the PHP verifier (ADR
  # 0163). tsc and ESLint (--max-warnings=0, no backlog) ride along.
  test:
    name: 'Vitest, TypeScript and ESLint'
    if: inputs.tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The verifier boots the unit suite's bootstrap, which loads Pro's autoloader.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: |
          composer install --no-progress
          composer install --working-dir=pro --no-progress
      - id: install
        uses: ./.github/actions/npm-install
      - run: npm run typecheck
      - run: npm run lint
      # Runs even when tsc or ESLint failed, so one push reports all three.
      - id: vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: WCONVERT_DUMP_CONVERSIONS="$RUNNER_TEMP/conversions.json" npm test
      - name: Converted designs
        if: ${{ !cancelled() && steps.vitest.outcome == 'success' }}
        run: php bin/verify-converted-designs.php "$RUNNER_TEMP/conversions.json"

  # The one build (ADR 0029). Always runs: its contracts are fail-closed.
  build:
    name: 'Build + contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
      visual: ${{ steps.visual.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      # wp-cli makes the POTs check:pot compares; missing is red, never a skip.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: wp-cli
      # ADR 0029 check a: source text only, so before any install.
      - name: Source contract (free carries no Pro)
        run: bash bin/verify-source-contract.sh
      - run: composer dist --no-progress
      # pro/packages/ (ADR 0143): Playground fatals without it; wp-scoper,
      # which writes it, is a dev dependency.
      - run: composer install --working-dir=pro --no-progress
      - uses: ./.github/actions/npm-install
      # The container tag for [visual], from the lockfile's @playwright/test.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: build
        run: npm run build
      # Uploaded before the asserts, so a failing contract still lets [visual]
      # report. A draft skips [visual]; a manual dispatch always runs it.
      - id: visual
        run: echo "run=${{ inputs.tests && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}" >> "$GITHUB_OUTPUT"
      - if: steps.visual.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-build
          path: |
            public/
            pro/public/
            pro/packages/
            vendor/
          retention-days: 1
      - name: Loader contract (budgets + no premium in free)
        run: npm run assert:loader
      # Each assert runs even when the one before it failed.
      - name: Admin contract (no Pro admin code, no "upgrade")
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run assert:admin
      - name: POT coverage (every string extracted)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:pot

  visual:
    name: 'Visual contracts: ${{ matrix.leg }}'
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.visual == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright }}-noble
      # The runner's own uid, so the workspace checkout stays writable.
      options: --user 1001
    strategy:
      # Every suite reports; any failed leg still fails Required checks.
      fail-fast: false
      matrix:
        # Packed by measured duration, ~6–7 minutes a leg; re-balance from
        # the per-suite timings in each leg's log.
        include:
          - { leg: admin, scripts: 'test:visual' }
          - { leg: storefront-a, scripts: 'test:visual:inline test:visual:reopen test:visual:content-lock' }
          - { leg: storefront-b, scripts: 'test:visual:popup test:visual:analytics test:visual:fullscreen test:visual:events' }
    steps:
      - uses: actions/checkout@v4
      # No PHP here: vendor/ comes from [build], PHP runs inside Playground.
      - uses: ./.github/actions/npm-install
      - uses: actions/download-artifact@v4
        with:
          name: visual-build
      - name: Run the suites
        shell: bash
        env:
          SCRIPTS: ${{ matrix.scripts }}
        run: |
          failed=()
          for script in $SCRIPTS; do
            echo "── npm run $script"
            started=$SECONDS
            npm run "$script" || failed+=("$script")
            echo "── $script took $((SECONDS - started)) s"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed: ${failed[*]}"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-visual-checks-${{ matrix.leg }}
          path: tools/visual-tests/out/
          retention-days: 14
