name: Frontend tests

# =============================================================================
# Vitest, tsc and ESLint over the admin app and both loader module trees.
#
#   [test]       Vitest under jsdom. Covers free's tree AND Pro's — Pro's
#                loader tests live under pro/ so that a test importing a Pro
#                module never lands in resources/, which IS a scan root for the
#                source contract. (tests/ is not a scan root in either language,
#                which is why the PHP tests for Pro's boot guard can sit in
#                tests/unit/Pro/ without contradicting this.)
#
#   [typecheck]  tsc --noEmit.
#
#   [lint]       ESLint at --max-warnings=0, from the first commit. There is no
#                backlog to grandfather, and holding it at zero is the whole
#                point: a lint backlog is what makes the signal worthless.
#
# Visual contracts build the admin bundle and run on disposable WordPress.
# Screenshots and traces are retained for review; geometry/style assertions gate
# the regressions that jsdom cannot see. No release ZIP is staged here.
#
# NO TRIGGERS OF ITS OWN beyond a manual dispatch. See ci.yml.
# =============================================================================

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 'Vitest'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  typecheck:
    name: 'TypeScript'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: 'ESLint'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  visual:
    name: 'Admin visual contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-interaction --no-progress --no-dev
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:admin
      - run: npm run test:visual
      - name: Build Pro admin and visitor loaders for fullscreen contracts
        run: npm run build:admin:pro && npm run build:loader && npm run build:loader:pro
      - run: npm run test:visual:popup
      - run: npm run test:visual:fullscreen
      - run: npm run test:visual:reopen
      - name: Build block and inspectors for inline contracts
        run: npm run build:block && npm run build:inspector && npm run build:inspector:pro
      - run: npm run test:visual:inline
      - run: npm run test:visual:content-lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-visual-checks
          path: tools/visual-tests/out/
          retention-days: 14
