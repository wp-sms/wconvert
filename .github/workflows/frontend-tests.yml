name: Frontend tests

# =============================================================================
# Vitest, tsc and ESLint over the admin app and both loader module trees.
#
#   [test]       Vitest under jsdom. Covers free's tree AND Pro's — Pro's
#                loader tests live under pro/ so that a test importing a Pro
#                module never lands in resources/, which IS a scan root for the
#                source contract. (tests/ is not a scan root in either language,
#                which is why the PHP tests for Pro's boot guard can sit in
#                tests/unit/Pro/ without contradicting this.) The same run
#                dumps every converted design for the PHP verifier (ADR 0163),
#                so the form-switch test runs once rather than in a job of its
#                own.
#
#   [static]     tsc --noEmit, then ESLint at --max-warnings=0, from the first
#                commit. There is no backlog to grandfather, and holding it at
#                zero is the whole point: a lint backlog is what makes the
#                signal worthless. One job, because each is seconds of work
#                behind a minute of setup.
#
# Visual contracts run on disposable WordPress. [build] runs `npm run
# build` once — every bundle, free and Pro — and hands public/, pro/public/ and
# vendor/ to [visual], a matrix of five legs: admin, the largest, split into two
# Playwright shards, and the storefront suites packed three ways by measured
# duration. Every config has its own port and its own outputDir, so a leg runs
# its suites back to back; it keeps going after a failure, so every suite still
# reports. Each leg boots its own Playground, so the legs share nothing but the
# build and none waits on another. Screenshots and traces are retained per leg;
# geometry/style assertions gate the regressions that jsdom cannot see. No
# release ZIP is staged here.
#
# WHY THE LEGS RUN IN THE PLAYWRIGHT CONTAINER. `playwright install
# --with-deps` apt-installs ~26 MB of fonts, and the runners' Ubuntu mirror
# throttles: in most runs one or more legs fetched at ~40 kB/s and spent 6–11
# minutes on a suite that takes 20 seconds. The image already carries the
# browsers and the same fonts. Its tag is read from the lockfile in
# [build], so it cannot drift from @playwright/test.
#
# A DRAFT PULL REQUEST SKIPS THE VISUAL SUITES. Marking it ready for review
# starts the full run, and GitHub refuses to merge a draft, so the run that
# gates a merge is always a full one. A manual dispatch always runs them.
#
# NO TRIGGERS OF ITS OWN beyond a manual dispatch. See ci.yml.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Run Vitest and the visual suites, not only the build and its contracts'
        type: boolean
        default: true
  workflow_call:
    inputs:
      tests:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Vitest covers free's tree and Pro's; Pro's loader tests live under pro/ so
  # no test importing a Pro module lands in resources/, a source-contract scan
  # root. The same run dumps every converted design for the PHP verifier (ADR
  # 0163). tsc and ESLint (--max-warnings=0, no backlog) ride along.
  test:
    name: 'Vitest, TypeScript and ESLint'
    if: inputs.tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The verifier boots the unit suite's bootstrap, which loads Pro's autoloader.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: |
          composer install --no-progress
          composer install --working-dir=pro --no-progress
      - id: install
        uses: ./.github/actions/npm-install
      - run: npm run typecheck
      - run: npm run lint
      # Runs even when tsc or ESLint failed, so one push reports all three.
      - id: vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: WCONVERT_DUMP_CONVERSIONS="$RUNNER_TEMP/conversions.json" npm test
      - name: Converted designs
        if: ${{ !cancelled() && steps.vitest.outcome == 'success' }}
        run: php bin/verify-converted-designs.php "$RUNNER_TEMP/conversions.json"

  # THE ONE BUILD (ADR 0029). Every bundle, free and Pro, built once; then
  # the asserts that read build output — the loader contract and byte budgets,
  # the admin contract, POT coverage — and the hand-off to [visual]. Always
  # runs: the contracts are fail-closed, so no diff may opt out of them.
  build:
    name: 'Build + contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
      visual: ${{ steps.visual.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      # wp-cli makes the two POTs check:pot compares against; a missing one is
      # a red step, never a skip.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: wp-cli
      # The free contract at the source (ADR 0029, check a): no build needed,
      # so it goes first.
      - name: Source contract (free carries no Pro)
        run: bash bin/verify-source-contract.sh
      - run: composer dist --no-progress
      # Pro's scoped licence SDK (ADR 0143): Playground fatals without
      # pro/packages/, and wp-scoper, which writes it, is a dev dependency.
      - run: composer install --working-dir=pro --no-progress
      - uses: ./.github/actions/npm-install
      # The container tag for [visual], from the lockfile's @playwright/test.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - name: Loader contract (budgets + no premium in free)
        run: npm run assert:loader
      - name: Admin contract (no Pro admin code, no "upgrade")
        run: npm run assert:admin
      - name: POT coverage (every string extracted)
        run: npm run check:pot
      # A draft skips the visual suites; a manual dispatch always runs them.
      - id: visual
        run: echo "run=${{ inputs.tests && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}" >> "$GITHUB_OUTPUT"
      - if: steps.visual.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-build
          path: |
            public/
            pro/public/
            pro/packages/
            vendor/
          retention-days: 1

  visual:
    name: 'Visual contracts: ${{ matrix.leg }}'
    needs: build
    if: needs.build.outputs.visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright }}-noble
      # The runner's own uid, so the workspace checkout stays writable.
      options: --user 1001
    strategy:
      # Report every suite even if one fails. Any failed leg still fails the
      # frontend-tests call, and with it the Required checks gate.
      fail-fast: false
      matrix:
        # Packed by measured duration, ~6–7 minutes a leg; re-balance from
        # the per-suite timings in each leg's log.
        include:
          - { leg: admin, scripts: 'test:visual' }
          - { leg: storefront-a, scripts: 'test:visual:inline test:visual:reopen test:visual:content-lock' }
          - { leg: storefront-b, scripts: 'test:visual:popup test:visual:analytics test:visual:fullscreen test:visual:events' }
    steps:
      - uses: actions/checkout@v4
      # No PHP or Composer here: vendor/ comes from the build, and PHP runs
      # inside Playground. node_modules is for the Playground CLI and Playwright.
      - uses: ./.github/actions/npm-install
      - uses: actions/download-artifact@v4
        with:
          name: visual-build
      - name: Run the suites
        shell: bash
        env:
          SCRIPTS: ${{ matrix.scripts }}
        run: |
          failed=()
          for script in $SCRIPTS; do
            echo "── npm run $script"
            started=$SECONDS
            npm run "$script" || failed+=("$script")
            echo "── $script took $((SECONDS - started)) s"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed: ${failed[*]}"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-visual-checks-${{ matrix.leg }}
          path: tools/visual-tests/out/
          retention-days: 14
