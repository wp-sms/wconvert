name: Frontend tests

# =============================================================================
# Vitest, tsc and ESLint over the admin app and both loader module trees.
#
#   [test]       Vitest under jsdom. Covers free's tree AND Pro's — Pro's
#                loader tests live under pro/ so that a test importing a Pro
#                module never lands in resources/, which IS a scan root for the
#                source contract. (tests/ is not a scan root in either language,
#                which is why the PHP tests for Pro's boot guard can sit in
#                tests/unit/Pro/ without contradicting this.)
#
#   [typecheck]  tsc --noEmit.
#
#   [lint]       ESLint at --max-warnings=0, from the first commit. There is no
#                backlog to grandfather, and holding it at zero is the whole
#                point: a lint backlog is what makes the signal worthless.
#
# Visual contracts run on disposable WordPress. [visual-build] runs `npm run
# build` once — every bundle, free and Pro — and hands public/, pro/public/ and
# vendor/ to [visual], a matrix with one leg per suite (admin, the largest, is
# split into two Playwright shards). Each leg boots its own Playground, so the
# legs share nothing but the build and none waits on another. Screenshots and
# traces are retained per leg; geometry/style assertions gate the regressions
# that jsdom cannot see. No release ZIP is staged here.
#
# NO TRIGGERS OF ITS OWN beyond a manual dispatch. See ci.yml.
# =============================================================================

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 'Vitest'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  typecheck:
    name: 'TypeScript'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: 'ESLint'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  visual-build:
    name: 'Visual contracts: build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-interaction --no-progress --no-dev
      - run: npm ci
      # The one script that builds everything, so no leg's build list can drift
      # from the suites that need it.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: visual-build
          path: |
            public/
            pro/public/
            vendor/
          retention-days: 1

  visual:
    name: 'Visual contracts: ${{ matrix.suite }}'
    needs: visual-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Report every suite even if one fails. Any failed leg still fails the
      # frontend-tests call, and with it the Required checks gate.
      fail-fast: false
      matrix:
        include:
          - { suite: admin-1, script: 'test:visual', args: '--shard=1/2' }
          - { suite: admin-2, script: 'test:visual', args: '--shard=2/2' }
          - { suite: popup, script: 'test:visual:popup' }
          - { suite: fullscreen, script: 'test:visual:fullscreen' }
          - { suite: reopen, script: 'test:visual:reopen' }
          - { suite: events, script: 'test:visual:events' }
          - { suite: inline, script: 'test:visual:inline' }
          - { suite: content-lock, script: 'test:visual:content-lock' }
          - { suite: analytics, script: 'test:visual:analytics' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # No PHP or Composer here: vendor/ comes from the build, and PHP runs
      # inside Playground. npm ci is for the Playground CLI and Playwright.
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: visual-build
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Still runs on a cache hit: --with-deps installs the system libraries,
      # which live outside the cached directory.
      - run: npx playwright install --with-deps chromium
      - run: npm run ${{ matrix.script }} -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-visual-checks-${{ matrix.suite }}
          path: tools/visual-tests/out/
          retention-days: 14
