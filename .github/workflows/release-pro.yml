name: Release Pro

# =============================================================================
# The PRO plugin. Driven by a `pro-v*` tag and nothing else.
#
#   guard ─────────── five conditions, and Pro is the only run with a fifth
#     ├── php-tests ── the same file the PR gate uses
#     ├── frontend-tests ─ likewise
#     │     └── build ─── the Pro ZIP, gated by the SAME artifact contract
#     │     └── publish_nexus ── OFF
#     └── summary ───── always runs, says what shipped and what did not
#
# TWO RELEASE WORKFLOWS, ONE GATE (ADR 0030). Read release-free.yml's header for
# why there are two; what matters here is the two ways this file differs from
# it, and both are load-bearing:
#
#   - ONLY THE FREE RUN STAGES FOR WP.ORG. Pro is not distributed there, has no
#     readme.txt and no Stable tag, and is not subject to Plugin Check. There
#     is no wp.org publish job below. Pro's distribution is Nexus, the
#     licensing store, behind its own switch.
#
#   - ONLY THE PRO RUN EVALUATES CONDITION 5. WCONVERT_MIN_CORE is the one
#     statement Pro makes about free, and it is checked against the highest
#     free version ACTUALLY PUBLISHED rather than the one in this tree.
#
# The artifact contract is the same script, invoked the same way, with no flag
# telling it which plugin it is looking at — the staged tree says (see
# bin/plugin-identity.php).
#
# ONE TRIGGER, as for free: a published GitHub Release. Both workflows listen to
# the same event because GitHub cannot filter a `release` trigger by tag
# pattern; the prefix in `guard.if` decides which one runs.
# =============================================================================

on:
  release:
    types: [published]

permissions:
  contents: read

# The workflow's own name is in the group, and it has to be: BOTH release
# workflows fire on every published release — the tag prefix decides which one
# does any work — so a group keyed only on the tag would put the two runs of
# the SAME event in one group. With cancel-in-progress false the second then
# queues behind the first for no reason at all.
concurrency:
  group: release-pro-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------------------
  # [0] GUARD — all five conditions.
  # ---------------------------------------------------------------------------
  guard:
    name: '[0] Guard'
    if: startsWith(github.event.release.tag_name, 'pro-v')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      published_core: ${{ steps.published.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: 'Condition 1/5 — publisher is allowed to release'
        env:
          ACTOR: ${{ github.actor }}
        run: bash bin/check-publisher.sh "$ACTOR"

      - name: 'Condition 3/5 — tag is on the default branch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$DEFAULT_BRANCH"
          bash bin/check-tag-on-branch.sh . "$TAG_SHA" "origin/$DEFAULT_BRANCH"

      # Two statements for Pro rather than free's three: the header and
      # WCONVERT_PRO_VERSION. There is no readme.txt because there is no wp.org
      # listing, and the check knows that from the tree rather than from a flag.
      - name: 'Conditions 2 & 4/5 — the tag names Pro, and every version agrees'
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="$(php bin/check-release-tag.php "$TAG" pro)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # CONDITION 5, IN TWO STEPS, AND THE SPLIT IS THE CHECK.
      #
      # The anchor is the version wp.org is SERVING, not the one in this
      # checkout. A check anchored to the repository passes the exact release
      # it exists to catch: Pro 1.3 requiring core 1.3 while free 1.3 sits in
      # the wp.org review queue — a Pro that refuses to boot on every install
      # that can exist, presenting to the merchant as premium features
      # silently missing with no error they can act on.
      #
      # So one step ASKS wp.org and the next COMPARES. Both fail closed: an
      # unreachable wp.org blocks a Pro hotfix, which is a cost, while a Pro
      # hotfix that shipped because nobody could reach wp.org to say no is the
      # failure the whole gate is about.
      # ---------------------------------------------------------------------
      - name: 'Condition 5/5 (a) — ask wp.org what free version is published'
        id: published
        run: |
          set -euo pipefail
          VERSION="$(bash bin/published-free-version.sh wconvert)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "wp.org is serving free $VERSION"

      - name: 'Condition 5/5 (b) — WCONVERT_MIN_CORE ≤ that version'
        env:
          PUBLISHED: ${{ steps.published.outputs.version }}
        run: php bin/check-min-core.php pro "$PUBLISHED"

      - name: Record the verdict
        env:
          TAG: ${{ github.event.release.tag_name }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISHED: ${{ steps.published.outputs.version }}
        run: |
          {
            echo "### Release guard passed"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Version: \`$VERSION\`"
            echo "- Highest free version published: \`$PUBLISHED\`"
            echo "- Published by: @$ACTOR"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # [1] TESTS — the same files the PR gate runs. Called, not copied. Both run,
  # not just the JS ones: Pro's PHP is what free's loader enqueue defers to, so
  # a Pro release that broke free's side would break both plugins at once.
  # ---------------------------------------------------------------------------
  php-tests:
    name: '[1] PHP tests'
    needs: guard
    uses: ./.github/workflows/php-tests.yml

  frontend-tests:
    name: '[1] Frontend tests'
    needs: guard
    uses: ./.github/workflows/frontend-tests.yml

  # ---------------------------------------------------------------------------
  # [2] BUILD — the Pro ZIPs, through the same script and the same contract.
  #
  # ONE PER TIER, AND ALL OF THEM EVERY TIME (ADR 0056). `bin/build.sh pro`
  # loops the ladder in tiers.json, cuts each stage down to that rung's modules
  # and runs the artifact contract on each before writing a ZIP. Only the top
  # rung is sold today; the other two are built anyway, because machinery that
  # is not exercised rots and the release that first needs a per-tier build is
  # the release nobody can wait for.
  # ---------------------------------------------------------------------------
  build:
    name: '[2] Build the Pro ZIPs'
    needs: [guard, php-tests, frontend-tests]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # EVERY bundle, free's included, because Pro's entries build from free's
      # modules plus their own (ADR 0028) — one command, and no arrangement
      # where Pro's is built from a stale copy of free's. That now means one
      # loader and one inspector per rung, plus Pro's admin bundle.
      - run: npm run build

      - name: Build, gated by the artifact contract
        run: bash bin/build.sh pro

      # Every rung's ZIP, in one artifact. `if-no-files-found: error` is what
      # makes a build that silently produced nothing a failed run.
      - name: Upload the Pro ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: pro-zips
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # [3] NEXUS — the three tier ZIPs to the licensing store. OFF until both
  # switches exist, as for free's wp.org publish:
  #   repository variables RELEASE_PUBLISH_ENABLED = true and PUBLISH_NEXUS = true
  #   (repository level, because a job's `if:` cannot read environment
  #   variables), and the `nexus` environment's NEXUS_API_KEY secret.
  # Environment variables: NEXUS_URL, NEXUS_PRODUCT_SLUG, NEXUS_CATALOG_ITEM_SLUG.
  #
  # One POST per tier, as the store's Release API expects. Skipped for
  # pre-releases: the store is told `release_type=stable` and nothing else.
  # The store is idempotent per (catalog item, tier, version), so a re-run only
  # fills the gaps; the tier is read from the file name `wconvert-pro-<tier>-v<version>.zip`.
  # ---------------------------------------------------------------------------
  publish_nexus:
    name: '[3] Publish → Nexus'
    needs: [guard, build]
    if: |
      needs.build.result == 'success' &&
      github.event.release.prerelease == false &&
      vars.RELEASE_PUBLISH_ENABLED == 'true' &&
      vars.PUBLISH_NEXUS == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    environment:
      name: nexus
    steps:
      - name: Download the Pro ZIPs
        uses: actions/download-artifact@v4
        with:
          name: pro-zips
          path: dist

      - name: Upload each tier to Nexus
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          NEXUS_URL: ${{ vars.NEXUS_URL }}
          PRODUCT_SLUG: ${{ vars.NEXUS_PRODUCT_SLUG }}
          CATALOG_ITEM_SLUG: ${{ vars.NEXUS_CATALOG_ITEM_SLUG }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail

          for name in NEXUS_API_KEY NEXUS_URL PRODUCT_SLUG CATALOG_ITEM_SLUG; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the nexus environment."
              exit 1
            fi
          done

          for zip in dist/*.zip; do
            filename="$(basename "$zip" .zip)"
            tier="${filename#"${CATALOG_ITEM_SLUG}-"}"
            tier="${tier%"-v${VERSION}"}"

            echo "Uploading $zip (tier=$tier, version=$VERSION)"
            curl -sf -X POST "${NEXUS_URL}/api/v1/${PRODUCT_SLUG}/releases" \
              -H "Authorization: Bearer ${NEXUS_API_KEY}" \
              -F "catalog_item_slug=${CATALOG_ITEM_SLUG}" \
              -F "version=${VERSION}" \
              -F "tier_slug=${tier}" \
              -F "release_type=stable" \
              -F "zip=@${zip}"
          done

  # ---------------------------------------------------------------------------
  # [4] SUMMARY — always runs.
  # ---------------------------------------------------------------------------
  summary:
    name: '[4] What shipped'
    needs: [guard, build, publish_nexus]
    if: always() && needs.guard.result != 'skipped'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Write the summary
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          PUBLISHED: ${{ needs.guard.outputs.published_core }}
          BUILD: ${{ needs.build.result }}
          NEXUS: ${{ needs.publish_nexus.result }}
        run: |
          set -euo pipefail
          {
            echo "## WConvert Pro ${VERSION}"
            echo ""
            if [ "$BUILD" = "success" ]; then
              echo "Built and contract-checked, one ZIP per tier. They are attached to this run for 14 days."
              echo ""
              echo "| Tier | ZIP |"
              echo "|---|---|"
              echo "| Basic | \`wconvert-pro-basic-v${VERSION}.zip\` |"
              echo "| Pro | \`wconvert-pro-pro-v${VERSION}.zip\` |"
              echo "| Elite | \`wconvert-pro-elite-v${VERSION}.zip\` |"
            else
              echo "Build or checks did not pass — no artifact was produced."
            fi
            echo ""
            echo "- Highest free version published: \`${PUBLISHED}\`"
            echo ""
            case "$NEXUS" in
              success) echo "- ✅ Nexus — published, one upload per tier" ;;
              skipped) echo "- ⏸️ Nexus — held back (switch is off, or this is a pre-release)" ;;
              failure) echo "- ❌ Nexus — FAILED; re-running is safe, the store keeps what it already holds" ;;
              *)       echo "- ⚪ Nexus — $NEXUS" ;;
            esac
            echo ""
            echo "Pro is not on WordPress.org. Publishing needs RELEASE_PUBLISH_ENABLED **and** PUBLISH_NEXUS, plus the NEXUS_API_KEY secret."
          } >> "$GITHUB_STEP_SUMMARY"
