name: Template service

# =============================================================================
# Deploys the templates.wconvert.io Worker from Git, so the live service runs
# exactly a commit on main. Pasting code into the dashboard is retired: it left
# production running a file nobody had reviewed.
#
#   push to main (tools/template-server/**) ── test ── deploy staging
#   workflow_dispatch (staging | production) ── test ── deploy that one
#
# Production is never deployed by a push. An operator dispatches it once
# staging has served the same commit, and the GitHub environment
# `template-service-production` holds its token, so a reviewer rule can be
# added there without touching this file.
#
# This deploys CODE. Catalogue data is published separately by
# `npm run publish` (tools/template-server/README.md), which a deploy neither
# runs nor changes.
#
# Pull requests are tested by ci.yml's `template-service` job, not here.
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'tools/template-server/**'
      - '.github/workflows/template-service.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Where to deploy'
        type: choice
        options: [staging, production]
        default: staging

# One deploy per environment at a time; a newer push waits rather than racing.
concurrency:
  group: template-service-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: tools/template-server

jobs:
  deploy:
    name: 'Deploy ${{ inputs.environment || ''staging'' }}'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: template-service-${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/template-server/package-lock.json

      - run: npm ci

      - name: Type-check and test
        run: npm run check && npm test

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET: ${{ inputs.environment || 'staging' }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = production ]; then
            npx wrangler deploy --message "${GITHUB_SHA}"
          else
            npx wrangler deploy --env staging --message "${GITHUB_SHA}"
          fi
