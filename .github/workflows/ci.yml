name: CI

# Every pull-request check. Require `CI / Required checks` and nothing else.
#
#   changes ── the path filters, read by bin/preflight.mjs too
#     ├── PHP tests        php-tests.yml        (php filter)
#     ├── Frontend         frontend-tests.yml   build + contracts ALWAYS; tests on js
#     ├── Template service                      (service filter)
#     └── Required checks  always runs, aggregates needs.*.result
#
# Filters live at job level so a skipped job still reports; no push trigger;
# no ZIP; a draft skips the visual suites. Why: ADR 0029, "The pull-request
# workflow". Run `npm run preflight` before pushing.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # paths-filter reads the changed-file list from the API on a pull request.
  pull-requests: read

jobs:
  changes:
    name: 'Changed paths'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      php: ${{ steps.filter.outputs.php }}
      js: ${{ steps.filter.outputs.js }}
      service: ${{ steps.filter.outputs.service }}
    steps:
      - uses: actions/checkout@v4

      # Pinned to a commit: a tag can be repointed.
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            php:
              - '**.php'
              - 'composer.json'
              - 'composer.lock'
              - 'pro/composer.*'
              - 'phpstan*.neon*'
              - 'phpstan-bootstrap.php'
              - 'phpunit.xml*'
              - 'bin/**'
              - 'tests/**'
              - 'resources/**/*.json'
              - 'pro/resources/**/*.json'
              - 'pro/modules/**/*.json'
              - 'tiers.json'
              - '.github/workflows/php-tests.yml'
              - '.github/workflows/ci.yml'
            js:
              - 'src/**'
              - 'bin/verify-converted-designs.php'
              - 'tools/visual-tests/**'
              - 'tools/design-system/seed/**'
              - 'composer.*'
              - '**.ts'
              - '**.tsx'
              - '**.js'
              - '**.jsx'
              - '**.mjs'
              - '**.css'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - 'resources/**'
              - 'pro/resources/**'
              - 'pro/modules/**'
              - 'pro/tests/**'
              - 'tiers.json'
              - '.github/workflows/frontend-tests.yml'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            # Everything a setup's revision is computed from, so a change
            # that stales an approval meets `templates:releasable`.
            service:
              - 'tools/template-server/**'
              - 'tools/design-library/**'
              - 'resources/templates/**'
              - 'resources/collections/**'
              - 'resources/renderer/**'
              - 'resources/playbooks/**'
              - 'pro/modules/*/templates/**'
              - 'pro/modules/*/playbooks/**'
              - 'src/Template/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'

  php-tests:
    name: 'PHP tests'
    needs: changes
    if: needs.changes.outputs.php == 'true'
    uses: ./.github/workflows/php-tests.yml

  # Unconditional: its build job carries the fail-closed contracts, which no
  # diff may opt out of (ADR 0029). The js filter gates only the tests.
  frontend-tests:
    name: 'Frontend'
    needs: changes
    uses: ./.github/workflows/frontend-tests.yml
    with:
      tests: ${{ needs.changes.outputs.js == 'true' }}

  # The hosted catalogue: the Worker and its publisher are not in the ZIP, so
  # this is the only place a pull request proves them.
  template-service:
    name: 'Template service'
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The exporter and studio run the shipping PHP reader.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - run: composer install --no-progress

      - uses: ./.github/actions/npm-install

      # Some studio tests import the Worker's operator scripts.
      - uses: ./.github/actions/npm-install
        with:
          directory: tools/template-server

      # No --with-deps: the image has Chromium's libraries, the apt mirror
      # throttles, and nothing here compares pixels, so fonts don't matter.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install chromium

      - name: Design library
        run: bash tools/design-library/build.sh renderer && npm run test:template-studio

      # Bundled revision files must match the registry (ADR 0156).
      - name: Catalogue revisions
        run: npm run templates:revisions:check

      # A new word needs its translation, or a German popup shows English (ADR 0183).
      - name: Design words
        run: npm run templates:words -- --check

      # A renderer edit stales every approval; the failure names the fix.
      - name: Approvals current
        run: npm run templates:releasable

      - name: Worker
        working-directory: tools/template-server
        run: npm run check && npm test

  # THE GATE. `if: always()` so it reports even "everything skipped". Skipped
  # passes; cancelled does not. A new suite is one more name in `needs:`.
  required-checks:
    name: 'Required checks'
    if: always()
    needs: [changes, php-tests, frontend-tests, template-service]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate the suite results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          {
            echo "| Job | Result |"
            echo "|---|---|"
            printf '%s' "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=$(printf '%s' "$RESULTS" \
            | jq -r '[to_entries[]
                      | select(.value.result != "success" and .value.result != "skipped")
                      | "\(.key) (\(.value.result))"]
                     | join(", ")')

          if [ -n "$FAILED" ]; then
            echo "::error::Not every check passed: $FAILED"
            exit 1
          fi

          echo "✓ every check either passed or was not needed for this change"
